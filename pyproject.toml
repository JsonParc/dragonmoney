[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stockbot"
version = "0.1.0"
description = "Multi-LLM debate trading bot for US stocks (paper/real)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "exchange_calendars>=4.5",
    "tzdata",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
ml = ["transformers>=4.40", "torch>=2.3", "sentence-transformers>=3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/stockbot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "network: needs internet access (deselected by default)",
    "slow: slow tests (deselected by default)",
]
addopts = "-m 'not network and not slow'"
filterwarnings = [
    "ignore:.*returning an ndarray that drops timezone.*",
]
